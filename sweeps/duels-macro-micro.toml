# The mirror duels with wc3env's own agent, wc3agent (wc3-macro-micro): DeepSeek V4.1 Flash as its macro, the cheapest
# of sweeps/duels.toml's models, and Haiku 4.5 as its micro in place of Jev. It plays through the env's session, on
# wc3agent's own observations; the duel's goal is pinned as wc3agent's scenarios pin theirs.
# agent-env wc3 sweep generate sweeps/duels-macro-micro.toml runs/duels-macro-micro
# agent-env wc3 sweep run runs/duels-macro-micro --budget <dollars>
name = "duels-macro-micro"
template = ["mirror-human", "mirror-orc", "mirror-undead", "mirror-nightelf"]
models = ["fireworks_ai/deepseek-v4p1-flash"]
seeds = [1, 2, 3, 4]
prompt = ""
max_cost_usd = 1.5
agent = {id = "wc3-macro-micro", env = {WC3_MICRO_MODEL = "anthropic/claude-haiku-4-5"}}
