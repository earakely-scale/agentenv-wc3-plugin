[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentenv-wc3"
version = "0.1.0"
description = "Warcraft III as an AgentEnv environment: an LLM agent plays a melee game through wc3env's raw orders."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agentenv", "mcp", "reinforcement-learning", "llm-agents", "warcraft", "wc3env", "rts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Real Time Strategy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# wc3env is not a dependency: the env image has it (Windows Python under Wine for the game, its sources for the
# server's game data), and tests install it from a checkout (CONTRIBUTING.md).
dependencies = [
    "agentenv-framework>=0.9.1260",
    "agentenv-framework-protocol>=0.1.275,<0.2",
    "httpx>=0.27,<1",
    "mcp>=1.25,<2",
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-timeout>=2", "anyio>=4", "httpx>=0.27,<1", "uvicorn>=0.30", "ruff>=0.16,<0.17", "pillow>=10.1"]

[project.urls]
Source = "https://github.com/earakely-scale/agentenv-wc3-plugin"
wc3env = "https://github.com/pwang724/wc3env"

[project.entry-points."agent_env.bundles"]
wc3 = "agentenv_wc3.bundles"

[project.entry-points."agent_env.cli_plugins"]
wc3 = "agentenv_wc3.cli:wc3"

[project.entry-points."agent_env.task_steps"]
wc3_match = "agentenv_wc3.steps:WC3MatchTaskStep"
save_wc3_replay = "agentenv_wc3.steps:SaveWC3ReplayTaskStep"
save_rts_recording = "agentenv_rts.steps:SaveRTSRecordingTaskStep"
rts_seat_agents = "agentenv_rts.steps:RTSSeatAgentsTaskStep"
rts_finish = "agentenv_rts.steps:RTSFinishTaskStep"
rts_broadcast = "agentenv_rts.steps:RTSBroadcastTaskStep"
rts_grade = "agentenv_rts.grade:RTSGradeTaskStep"

[tool.hatch.build.targets.wheel]
packages = ["src/agentenv_wc3", "src/agentenv_rts"]

[tool.pytest.ini_options]
timeout = 300
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
