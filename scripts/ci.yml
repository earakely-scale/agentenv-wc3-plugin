# CI: copy to .github/workflows/ci.yml to turn it on.
name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  WC3ENV_REF: eb660aa558fb6e5c639a1ff404082f7dc0ee483e   # the commit agents/wc3-player/Dockerfile pins
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pwang724/wc3env
          ref: ${{ env.WC3ENV_REF }}
          path: wc3env
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv venv --python 3.11 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      # wc3env's wheel is Windows-only: the tests take its sources (the fake game, wc3agent) from the checkout
      - run: PYTHONPATH=wc3env/src:wc3env/wc3agent/src .venv/bin/pytest
      - run: .venv/bin/agent-env plugin check
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pwang724/wc3env
          ref: ${{ env.WC3ENV_REF }}
          path: wc3env
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e .
      - name: The env and the agent on the fake game, and the smoke task through agent-env
        run: |
          docker run -d -p 5000:5000 --name registry public.ecr.aws/docker/library/registry:2
          .venv/bin/agent-env wc3 setup --fake --wc3env wc3env --agent
          .venv/bin/agent-env run wc3 --task smoke
